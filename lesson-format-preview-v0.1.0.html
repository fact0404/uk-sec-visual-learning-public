<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>共通HTMLフォーマット見本 | 佑啓塾</title>
  <style>/* Shared shell only. Lesson visuals retain their own scoped styles. */
.vl-page{margin:0;background:#fafaf8;color:#263832;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.6;color-scheme:light}
.vl-shell,.vl-shell *{box-sizing:border-box}
.vl-shell{--vl-line:#dce3de;--vl-muted:#59675f;--vl-accent:#25654c;--vl-space:clamp(16px,3vw,32px);width:100%;max-width:1088px;min-height:100svh;margin-inline:auto;padding-inline:var(--vl-space);display:flex;flex-direction:column}
.vl-shell[data-width=wide]{max-width:1488px}
.vl-header{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-block:16px;border-bottom:1px solid var(--vl-line);font-size:14px}
.vl-brand{font-weight:700;white-space:nowrap}.vl-brand>span{margin-left:10px;color:var(--vl-muted);font-weight:400}
.vl-context{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0;color:var(--vl-muted);overflow-wrap:anywhere}
.vl-subject{color:var(--vl-accent);font-weight:700}
.vl-main{width:100%;padding-block:clamp(24px,4vw,40px);flex:1;min-width:0;outline-offset:4px}
.vl-question{font-size:clamp(23px,3vw,32px);font-weight:700;letter-spacing:.015em;line-height:1.5;margin:0 0 24px;overflow-wrap:anywhere}
.vl-experiment{border:1px solid var(--vl-line);border-radius:16px;background:#fff;min-width:0}
.vl-stage{padding:clamp(16px,3vw,32px);min-width:0;border-radius:16px 16px 0 0}
.vl-stage svg,.vl-stage canvas,.vl-stage img,.vl-stage video{display:block;max-width:100%}
.vl-controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;padding:16px;border-top:1px solid var(--vl-line)}
.vl-shell button,.vl-shell input,.vl-shell select{font:inherit}
.vl-shell button{min-width:44px;min-height:48px;padding:10px 20px;border-radius:10px;border:1px solid var(--vl-accent);background:var(--vl-accent);color:#fff;cursor:pointer;line-height:1.5;white-space:normal}
.vl-shell button:disabled{cursor:default;opacity:.55}
.vl-shell .vl-secondary{background:#fff;color:var(--vl-accent)}
.vl-shell :is(button,input,select,summary,a):focus-visible,.vl-skip:focus-visible{outline:3px solid #266fb0;outline-offset:4px}
.vl-shell input[type=range]{min-height:44px;max-width:100%;accent-color:var(--vl-accent)}
.vl-details{margin-top:16px;border-bottom:1px solid var(--vl-line);color:var(--vl-muted);font-size:14px}
.vl-details>summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;cursor:pointer;list-style:none}
.vl-details>summary::-webkit-details-marker{display:none}.vl-details>summary::after{content:'＋';font-size:20px}.vl-details[open]>summary::after{content:'−'}
.vl-detail-body{padding:8px 0 20px;max-width:76ch;line-height:1.9;overflow-wrap:anywhere}.vl-detail-body p{margin:0 0 12px}.vl-detail-body p:last-child{margin-bottom:0}
.vl-footer{border-top:1px solid var(--vl-line);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding-block:16px;color:var(--vl-muted);font-size:12px}
.vl-skip{position:absolute;left:16px;top:-100px;background:white;padding:12px;z-index:10;color:#263832}.vl-skip:focus{top:12px}
.vl-page>noscript{display:block;padding:16px;text-align:center}
@media(max-width:480px){.vl-header{align-items:flex-start;gap:8px}.vl-context{width:100%}.vl-question{margin-bottom:20px}.vl-controls{padding:12px}.vl-experiment{border-radius:12px}}
@media print{.vl-shell{min-height:0}.vl-controls,.vl-skip{display:none}.vl-page{background:white}}

 .format-review{padding:12px max(16px,calc((100% - 1024px)/2));display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap;background:#edf1ed;border-bottom:1px solid #dce3de;font-size:13px;box-sizing:border-box}.format-review small{width:100%;color:#59675f}.format-review label{display:flex;align-items:center;gap:8px}.format-review select{font:inherit;min-height:44px;background:#fff;border:1px solid #b4c2b8;border-radius:8px;padding:8px;color:#263832;max-width:100%}.format-review select:focus-visible{outline:3px solid #266fb0;outline-offset:3px}.format-review~.vl-shell{min-height:calc(100svh - 116px)}
 .fraction-demo{display:grid;place-items:center;min-height:clamp(200px,34vh,340px);gap:12px;padding-block:20px}.fraction-demo svg{width:100%;max-width:660px;height:auto}.fraction-value{margin:0;text-align:center;font-size:32px;min-height:66px}.fraction-value [hidden]{display:none}.vl-stage{background:#f8faf7}.demo-instruction{margin:0;color:#59675f;font-size:14px;text-align:center}@media print{.format-review{display:none}}
 </style>
</head>
<body class="vl-page">
  <aside class="format-review" aria-label="書式の確認"><span>共通フォーマット見本</span><label>表示幅 <select id="preview-width"><option value="standard">標準</option><option value="wide">ワイド（3D・地図向け）</option></select></label><small>この帯は確認用です。生徒用テンプレートには含めません。</small></aside>
  <a class="vl-skip" href="#lesson-main">教材へ進む</a>
  <div class="vl-shell" data-width="standard">
    <header class="vl-header">
      <span class="vl-brand">佑啓塾 <span>ビジュアル教材</span></span>
      <p class="vl-context"><span class="vl-subject">数学</span><span>分数</span></p>
    </header>
    <main class="vl-main" id="lesson-main" tabindex="-1">
      <h1 class="vl-question">分け方を変えても、塗った量は同じ？</h1>
      <section class="vl-experiment" aria-label="図と操作">
        <div class="vl-stage"><div class="fraction-demo"><svg viewBox="0 0 660 140" role="img" aria-label="同じ大きさの帯。左半分が緑色。操作すると各半分がさらに二つに分かれます。"><rect x="10" y="20" width="640" height="100" rx="4" fill="white" stroke="#637b6b" stroke-width="2"/><path d="M14 21 H330 V119 H14 Q11 119 11 115 V25 Q11 21 14 21" fill="#a7d4bb"/><path d="M330 20 V120" stroke="#345844" stroke-width="2"/><g id="extra-cuts" visibility="hidden" stroke="#345844" stroke-width="2"><path d="M170 20 V120 M490 20 V120"/></g></svg><p class="fraction-value" aria-live="polite" aria-atomic="true"><span id="fraction-half"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow><annotation encoding="application/x-tex">\frac{1}{2}</annotation></semantics></math></span></span><span id="fraction-quarters" hidden><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mfrac><mn>2</mn><mn>4</mn></mfrac></mrow><annotation encoding="application/x-tex">\frac{2}{4}</annotation></semantics></math></span></span></p><p class="demo-instruction">緑色の部分に注目しよう。</p></div></div>
        <div class="vl-controls"><button type="button" id="partition-toggle" aria-pressed="false">さらに半分に分ける</button></div>
      </section>
      <details class="vl-details">
        <summary>ヒント・しくみ・出典</summary>
        <div class="vl-detail-body"><p>区切りを増やしても、帯全体と塗った部分の大きさは変わりません。</p><p>このページは共通の画面構成を確認するための見本です。数学を例にしていますが、ヘッダー・メイン・フッターは5教科で共用します。</p><p>本番教材では、ここに必要なヒント・モデルの限界・出典を置きます。講師向けの管理情報は別ページで扱います。</p></div>
      </details>
    </main>
    <footer class="vl-footer"><span>佑啓塾</span><span>ビジュアル教材</span></footer>
  </div>
  <noscript>図はそのまま読めます。操作するにはJavaScriptを有効にしてください。</noscript>
  <script>// Layout review controls are outside the student template.
const shell = document.querySelector('.vl-shell');
document.querySelector('#preview-width').addEventListener('change', event => {
  shell.dataset.width = event.target.value;
});
const toggle = document.querySelector('#partition-toggle');
let divided = false;
toggle.addEventListener('click', () => {
  divided = !divided;
  document.querySelector('#extra-cuts').setAttribute('visibility', divided ? 'visible' : 'hidden');
  document.querySelector('#fraction-half').hidden = divided;
  document.querySelector('#fraction-quarters').hidden = !divided;
  toggle.textContent = divided ? 'もとの分け方に戻す' : 'さらに半分に分ける';
  toggle.setAttribute('aria-pressed', String(divided));
});
</script>
</body>
</html>
